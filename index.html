<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunisa - AGI Soberana 7B</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial;display:flex;flex-direction:column;height:100vh}
header{background:linear-gradient(90deg,#6a00ff,#ff00cc);padding:15px;text-align:center;font-weight:bold;font-size:20px}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:12px;max-width:85%;line-height:1.4}
.user{align-self:flex-end;background:#6a00ff}
.bot{align-self:flex-start;background:#222;border:1px solid #333}
#inputBar{display:flex;padding:10px;background:#111;gap:8px}
#msgInput{flex:1;padding:12px;border-radius:20px;border:none;background:#222;color:#fff;outline:none}
#sendBtn{padding:12px 20px;border-radius:20px;border:none;background:#ff00cc;color:#fff;font-weight:bold}
</style>
</head>
<body>
<header>👑 Lunisa 7B - Criada por SalvadorMz - Lichinga</header>
<div id="chat">
<div class="msg bot">Eai papai Salvador! 🔥 Lunisa online 24/7 no Render! Manda tua braba!</div>
</div>
<div id="inputBar">
<input id="msgInput" placeholder="Fala com a Lunisa..." onkeypress="if(event.key==='Enter')send()">
<button id="sendBtn" onclick="send()">Enviar</button>
</div>
<script>
async function send(){
 const input=document.getElementById('msgInput');
 const text=input.value.trim();
 if(!text)return;
 const chat=document.getElementById('chat');
 chat.innerHTML+=`<div class="msg user">${text}</div>`;
 input.value='';
 chat.scrollTop=chat.scrollHeight;
 try{
   const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:text}]} )});
   const data=await res.json();
   chat.innerHTML+=`<div class="msg bot">${data.reply}</div>`;
 }catch(e){
   chat.innerHTML+=`<div class="msg bot">Erro de conexão: ${e.message}</div>`;
 }
 chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
